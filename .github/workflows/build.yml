name: CI

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ci-prerelease
  cancel-in-progress: true

env:
  ProjectName: BlinderKitten
  DepsUrl: http://benjamin.kuperberg.fr/chataigne/user/data/Chataigne-win-x64-debug-dependencies.zip

jobs:
  windows-debug:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Checkout JUCE
        uses: actions/checkout@v4
        with:
          repository: norbertrostaing/JUCE
          ref: develop-local
          path: JUCE

      # Same as the local build: VisualStudio2022 project + in-repo JUCE include path
      - name: Point build at in-repo JUCE
        shell: bash
        run: |
          cat > Builds/VisualStudio2022/Directory.Build.local.props <<'PROPS'
          <Project>
            <ItemDefinitionGroup>
              <ClCompile>
                <AdditionalIncludeDirectories>$(MSBuildThisFileDirectory)..\..\JUCE\modules;%(AdditionalIncludeDirectories)</AdditionalIncludeDirectories>
              </ClCompile>
            </ItemDefinitionGroup>
          </Project>
          PROPS

      - uses: microsoft/setup-msbuild@v2

      - name: Build (Debug x64)
        run: msbuild Builds/VisualStudio2022/${{ env.ProjectName }}.sln /p:PreferredToolArchitecture=x64 /m /v:m /p:Configuration=Debug /p:Platform=x64

      - name: Fetch dependencies
        shell: powershell
        working-directory: ./Binaries/Debug/App
        run: |
          Invoke-WebRequest "${{ env.DepsUrl }}" -OutFile ../deps.zip
          7z x ../deps.zip -aos

      - name: Create installer
        id: pkg
        shell: powershell
        run: |
          $name = "${{ env.ProjectName }}-win-x64-debug-" + $env:GITHUB_SHA.Substring(0,7)
          (Get-Content install.iss) -replace 'Binaries/CI/App','Binaries/Debug/App' | Set-Content install-ci.iss
          & "C:/Program Files (x86)/Inno Setup 6/ISCC.exe" install-ci.iss /O. "/F$name"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "file=$name.exe" | Out-File -FilePath $Env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Publish prerelease "CI" (only the latest installer)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete CI --cleanup-tag --yes || true
          gh release create CI "${{ steps.pkg.outputs.file }}" --prerelease --target "$GITHUB_SHA" \
            --title "CI (${GITHUB_SHA::7})" --notes "Debug build of $GITHUB_SHA"
