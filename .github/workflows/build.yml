name: CI

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ci-prerelease
  cancel-in-progress: true

env:
  ProjectName: BlinderKitten
  DepsBase: http://benjamin.kuperberg.fr/chataigne/user/data/Chataigne-win-x64-

jobs:
  windows:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - config: Debug
            lower: debug
            outdir: Binaries/Debug/App
          - config: Release
            lower: release
            outdir: Binaries/App
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Checkout JUCE
        uses: actions/checkout@v4
        with:
          repository: norbertrostaing/JUCE
          ref: develop-local
          path: JUCE

      # Same as the local build: VisualStudio2022 project + in-repo JUCE include path
      - name: Point build at in-repo JUCE
        shell: bash
        run: |
          cat > Builds/VisualStudio2022/Directory.Build.local.props <<'PROPS'
          <Project>
            <ItemDefinitionGroup>
              <ClCompile>
                <AdditionalIncludeDirectories>$(MSBuildThisFileDirectory)..\..\JUCE\modules;%(AdditionalIncludeDirectories)</AdditionalIncludeDirectories>
              </ClCompile>
            </ItemDefinitionGroup>
          </Project>
          PROPS

      - uses: microsoft/setup-msbuild@v2

      - name: Build (${{ matrix.config }} x64)
        run: msbuild Builds/VisualStudio2022/${{ env.ProjectName }}.sln /p:PreferredToolArchitecture=x64 /m /v:m /p:Configuration=${{ matrix.config }} /p:Platform=x64

      - name: Fetch dependencies
        shell: powershell
        working-directory: ./${{ matrix.outdir }}
        run: |
          Invoke-WebRequest "${{ env.DepsBase }}${{ matrix.lower }}-dependencies.zip" -OutFile ../deps.zip
          7z x ../deps.zip -aos

      - name: Create installer
        id: pkg
        shell: powershell
        run: |
          $name = "${{ env.ProjectName }}-win-x64-${{ matrix.lower }}-" + $env:GITHUB_SHA.Substring(0,7)
          (Get-Content install.iss) -replace 'Binaries/CI/App','${{ matrix.outdir }}' | Set-Content install-ci.iss
          & "C:/Program Files (x86)/Inno Setup 6/ISCC.exe" install-ci.iss /O. "/F$name"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "file=$name.exe" | Out-File -FilePath $Env:GITHUB_OUTPUT -Encoding utf8 -Append

      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.lower }}
          path: ${{ steps.pkg.outputs.file }}

  publish:
    needs: windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          merge-multiple: true

      - name: Publish prerelease "CI" (only the latest installers)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete CI --cleanup-tag --yes || true
          gh release create CI *.exe --prerelease --target "$GITHUB_SHA" \
            --title "CI (${GITHUB_SHA::7})" --notes "Debug and Release builds of $GITHUB_SHA"
